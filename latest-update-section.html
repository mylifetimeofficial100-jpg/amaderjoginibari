     পুরোপুরি মুছে ফেলুন (section ট্যাগ থেকে শেষ পর্যন্ত)
  3. এই পুরো কোডটি সেই জায়গায় পেস্ট করুন

<section id="latest-update" style="padding: 60px 20px; background: #d6cdb2;">
  <div style="max-width: 900px; margin: 0 auto;">

    <div style="text-align: center; margin-bottom: 40px;">
      <span style="display:inline-block; font-size:0.8rem; letter-spacing:3px; text-transform:uppercase; color:#b84a42; margin-bottom:10px;">আপডেট</span>
      <h2 style="font-family:'Baloo Da 2',sans-serif; font-size:clamp(1.8rem,4vw,2.5rem); color:#12261a; margin:0 0 12px;">লেটেস্ট আপডেট</h2>
      <p style="color:#3f382c; font-size:1.05rem; max-width:560px; margin:0 auto;">গ্রামের সাম্প্রতিক খবর, নোটিশ ও গুরুত্বপূর্ণ আপডেট এখানে দেখুন।</p>
    </div>

    <div id="posts-container">
      <p style="text-align:center; color:#666; padding:30px 0;">লোড হচ্ছে...</p>
    </div>

  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  // একই config যা admin-premium.html এ আছে
  var config = {
    apiKey: "AIzaSyBqiOcn85zgvzDXt_Y60e3CQDEpdlYRBQ0",
    authDomain: "amader-joginibari.firebaseapp.com",
    projectId: "amader-joginibari",
    storageBucket: "amader-joginibari.firebasestorage.app",
    messagingSenderId: "917158468104",
    appId: "1:917158468104:web:039539cca785319febcfbd",
    measurementId: "G-SK4FHVPSTE"
  };

  try {
    if (!window.firebase) {
      document.getElementById("posts-container").innerHTML =
        '<p style="text-align:center;color:#b84a42;padding:30px 0;">Firebase লোড হয়নি। পেজ রিফ্রেশ করুন।</p>';
      return;
    }
    if (!firebase.apps.length) {
      firebase.initializeApp(config);
    }
  } catch (e) {
    console.error("Firebase init error:", e);
    document.getElementById("posts-container").innerHTML =
      '<p style="text-align:center;color:#b84a42;padding:30px 0;">Firebase শুরু করতে সমস্যা।</p>';
    return;
  }

  var db = firebase.firestore();

  function ytId(link) {
    if (!link) return null;
    var m = link.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/watch\?.+&v=))([\w-]{11})/);
    return m ? m[1] : null;
  }

  function fmtDate(ts) {
    if (!ts || !ts.toDate) return "";
    try {
      return ts.toDate().toLocaleDateString("bn-BD", {
        year: "numeric", month: "long", day: "numeric"
      });
    } catch (e) { return ""; }
  }

  function esc(s) {
    if (!s) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtSize(b) {
    if (!b) return "";
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }

  function renderMedia(m) {
    if (!m || !m.url) return "";
    var h = "";

    if (m.type === "image") {
      h += '<img src="' + m.url + '" alt="" style="width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-bottom:14px;display:block;" loading="lazy" onerror="this.style.display=\'none\'">';
    }
    else if (m.type === "video") {
      h += '<video src="' + m.url + '" controls playsinline style="width:100%;max-height:400px;border-radius:10px;margin-bottom:14px;background:#000;"></video>';
    }
    else if (m.type === "audio") {
      h += '<div style="background:#f0ebe0;padding:14px;border-radius:10px;margin-bottom:14px;">' +
        '<div style="font-size:0.85rem;color:#5c5346;margin-bottom:8px;">🎵 ' + esc(m.name || "অডিও") + '</div>' +
        '<audio src="' + m.url + '" controls style="width:100%;"></audio></div>';
    }
    else if (m.type === "youtube") {
      var id = ytId(m.url);
      if (id) {
        h += '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;background:#000;margin-bottom:14px;">' +
          '<iframe src="https://www.youtube.com/embed/' + id + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" ' +
          'allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
      }
    }
    else if (m.type === "pdf" || m.type === "file" || m.type === "link") {
      var icon = m.type === "pdf" ? "📄" : (m.type === "link" ? "🔗" : "📎");
      var size = m.size ? " (" + fmtSize(m.size) + ")" : "";
      h += '<a href="' + m.url + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;background:#e8f0eb;color:#1f4a32;padding:12px 16px;border-radius:8px;text-decoration:none;margin-bottom:12px;font-weight:500;">' +
        '<span style="font-size:1.4rem;">' + icon + '</span>' +
        '<span>' + esc(m.name || "ফাইল") + size + '</span>' +
        '<span style="margin-left:auto;font-size:0.85rem;">খুলুন →</span></a>';
    }
    return h;
  }

  db.collection("posts")
    .orderBy("createdAt", "desc")
    .limit(30)
    .get()
    .then(function (snap) {
      var box = document.getElementById("posts-container");
      if (!box) return;

      if (snap.empty) {
        box.innerHTML = '<p style="text-align:center;color:#666;padding:40px 0;font-size:1.05rem;">এখনো কোনো আপডেট নেই। শীঘ্রই নতুন আপডেট আসবে।</p>';
        return;
      }

      var html = "";
      snap.forEach(function (doc) {
        var d = doc.data();
        html += '<div style="background:#faf8f2;border:1px solid #e5e0d5;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 4px 14px rgba(18,38,26,0.06);">';

        if (d.createdAt) {
          html += '<div style="font-size:0.82rem;color:#b84a42;margin-bottom:10px;">' + fmtDate(d.createdAt) + '</div>';
        }
        if (d.title) {
          html += '<h3 style="margin:0 0 10px;font-size:1.2rem;color:#12261a;font-weight:600;">' + esc(d.title) + '</h3>';
        }
        if (d.text) {
          html += '<p style="margin:0 0 14px;line-height:1.75;color:#1a1610;font-size:1.05rem;white-space:pre-wrap;">' + esc(d.text) + '</p>';
        }

        // নতুন media অ্যারে
        if (d.media && d.media.length) {
          d.media.forEach(function (m) {
            html += renderMedia(m);
          });
        }
        // পুরনো ফরম্যাট
        else {
          if (d.imageLink) {
            html += '<img src="' + d.imageLink + '" alt="" style="width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-bottom:14px;display:block;" loading="lazy" onerror="this.style.display=\'none\'">';
          }
          if (d.videoLink) {
            var id = ytId(d.videoLink);
            if (id) {
              html += '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;background:#000;margin-bottom:14px;">' +
                '<iframe src="https://www.youtube.com/embed/' + id + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen loading="lazy"></iframe></div>';
            }
          }
        }

        html += '</div>';
      });

      box.innerHTML = html;
    })
    .catch(function (err) {
      console.error("Posts load error:", err);
      var box = document.getElementById("posts-container");
      if (!box) return;

      var msg = "ডেটা লোড করতে সমস্যা হয়েছে।";
      if (err && err.code === "permission-denied") {
        msg = "Firestore অনুমতি নেই। Firebase Console → Firestore → Rules চেক করুন।";
      } else if (err && /index/i.test(err.message || "")) {
        msg = "Firestore Index দরকার। Console-এ লিংক ক্লিক করে Index তৈরি করুন।";
      }

      box.innerHTML = '<p style="text-align:center;color:#b84a42;padding:30px 0;">' + msg + '<br><small style="color:#888;">' + (err.message || "") + '</small></p>';
    });
})();
</script>
