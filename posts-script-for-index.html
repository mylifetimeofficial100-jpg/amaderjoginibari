<!-- ========== এই অংশটুকু index.html এর খবরাখবর / নোটিশ সেকশনে বসান ========== -->

<div id="posts-container" style="margin: 20px 0;">
  <p style="text-align:center; color:#666;">লোড হচ্ছে...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBqiOcn85zgvzDXt_Y60e3CQDEpdlYRBQ0",
    authDomain: "amader-joginibari.firebaseapp.com",
    projectId: "amader-joginibari",
    storageBucket: "amader-joginibari.firebasestorage.app",
    messagingSenderId: "917158468104",
    appId: "1:917158468104:web:039539cca785319febcfbd",
    measurementId: "G-SK4FHVPSTE"
  };

  // Firebase ইতিমধ্যে initialize করা থাকলে আবার করবে না
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  function extractYouTubeId(link) {
    if (!link) return null;
    const match = link.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/watch\?.+&v=))([\w-]{11})/);
    return match ? match[1] : null;
  }

  db.collection("posts").orderBy("createdAt", "desc").get()
    .then(snapshot => {
      const container = document.getElementById("posts-container");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p style='text-align:center; color:#666; padding:20px;'>এখনো কোনো নোটিশ নেই।</p>";
        return;
      }

      snapshot.forEach(doc => {
        const d = doc.data();
        const div = document.createElement("div");
        div.style.cssText = "border:1px solid #e5e0d5; padding:16px; margin-bottom:16px; border-radius:10px; background:#faf8f2; box-shadow:0 2px 8px rgba(0,0,0,0.04);";

        let html = "";
        if (d.text) {
          html += `<p style="margin:0 0 12px; line-height:1.7; color:#1a1610;">${d.text}</p>`;
        }
        if (d.imageLink) {
          html += `<img src="${d.imageLink}" alt="নোটিশ ছবি" style="max-width:100%; border-radius:8px; margin-bottom:10px; display:block;">`;
        }
        if (d.videoLink) {
          const videoId = extractYouTubeId(d.videoLink);
          if (videoId) {
            html += `<div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:8px;">
              <iframe src="https://www.youtube.com/embed/${videoId}" 
                style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" 
                allowfullscreen></iframe>
            </div>`;
          }
        }
        div.innerHTML = html;
        container.appendChild(div);
      });
    })
    .catch(err => {
      console.error("পোস্ট লোড করতে সমস্যা:", err);
      document.getElementById("posts-container").innerHTML = 
        "<p style='text-align:center; color:#b84a42; padding:20px;'>ডেটা লোড করতে সমস্যা হয়েছে। পরে আবার চেষ্টা করুন।</p>";
    });
</script>
