<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মতামত ম্যানেজার — আমাদের যোগিনীবাড়ী</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    background: #f4f1e8;
    margin: 0;
    padding: 20px 14px 60px;
    color: #1a2e22;
  }
  h1 {
    font-size: 1.3rem;
    color: #163726;
    text-align: center;
    margin-bottom: 4px;
  }
  .sub {
    text-align: center;
    color: #6b7d70;
    font-size: 0.85rem;
    margin-bottom: 22px;
  }
  #list { max-width: 640px; margin: 0 auto; }
  .card {
    background: #fff;
    border: 1px solid #e2ddca;
    border-left: 4px solid #1f4a32;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .card .name { font-weight: 700; color: #163726; font-size: 1rem; }
  .card .date { color: #8a9a8e; font-size: 0.78rem; margin-left: 8px; }
  .card .msg {
    margin: 10px 0;
    line-height: 1.6;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .card textarea {
    width: 100%;
    min-height: 90px;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 1px solid #cfd8d0;
    border-radius: 6px;
    resize: vertical;
    margin: 10px 0;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-edit { background: #e9d9a8; color: #4a3a12; }
  .btn-save { background: #1f4a32; color: #fff; }
  .btn-cancel { background: #eee; color: #444; }
  .btn-delete { background: #b84a42; color: #fff; }
  .status { text-align: center; color: #6b7d70; padding: 30px 0; }
  .empty { text-align: center; color: #8a9a8e; padding: 30px 0; }
</style>
</head>
<body>

<h1>🗨️ মতামত ম্যানেজার</h1>
<div class="sub">আমাদের যোগিনীবাড়ী — সবার পাঠানো মতামত এখান থেকে এডিট বা ডিলিট করুন</div>

<div id="list">
  <div class="status">লোড হচ্ছে...</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBqiOcn85zgvzDXt_Y60e3CQDEpdlYRBQ0",
  authDomain: "amader-joginibari.firebaseapp.com",
  projectId: "amader-joginibari",
  storageBucket: "amader-joginibari.firebasestorage.app",
  messagingSenderId: "917158468104",
  appId: "1:917158468104:web:039539cca785319febcfbd"
});
var db = firebase.firestore();
var listEl = document.getElementById('list');

function formatDate(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });
}

function loadOpinions() {
  listEl.innerHTML = '<div class="status">লোড হচ্ছে...</div>';
  db.collection('opinions').orderBy('createdAt', 'desc').get()
    .then(function (snap) {
      if (snap.empty) {
        listEl.innerHTML = '<div class="empty">এখনো কোনো মতামত নেই।</div>';
        return;
      }
      listEl.innerHTML = '';
      snap.forEach(function (doc) {
        var data = doc.data();
        var card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = doc.id;
        card.innerHTML =
          '<span class="name">' + escapeHtml(data.name || 'নাম নেই') + '</span>' +
          '<span class="date">' + formatDate(data.createdAt) + '</span>' +
          '<div class="msg">' + escapeHtml(data.message || '') + '</div>' +
          '<div class="btn-row">' +
            '<button class="btn-edit" onclick="startEdit(this)">✏️ এডিট</button>' +
            '<button class="btn-delete" onclick="deleteOpinion(this)">🗑️ ডিলিট</button>' +
          '</div>';
        listEl.appendChild(card);
      });
    })
    .catch(function (err) {
      console.error(err);
      listEl.innerHTML = '<div class="empty">লোড করা যায়নি। Firestore Rules-এ read অনুমতি আছে কিনা দেখুন।</div>';
    });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function startEdit(btn) {
  var card = btn.closest('.card');
  var msgDiv = card.querySelector('.msg');
  var currentText = msgDiv.textContent;
  var textarea = document.createElement('textarea');
  textarea.value = currentText;
  msgDiv.replaceWith(textarea);

  var btnRow = card.querySelector('.btn-row');
  btnRow.innerHTML =
    '<button class="btn-save" onclick="saveEdit(this)">✅ সেভ করুন</button>' +
    '<button class="btn-cancel" onclick="loadOpinions()">✖ বাতিল</button>';
}

function saveEdit(btn) {
  var card = btn.closest('.card');
  var id = card.dataset.id;
  var textarea = card.querySelector('textarea');
  var newText = textarea.value.trim();
  if (!newText) { alert('মতামত খালি রাখা যাবে না।'); return; }

  btn.disabled = true;
  btn.textContent = 'সেভ হচ্ছে...';

  db.collection('opinions').doc(id).update({ message: newText })
    .then(function () {
      loadOpinions();
    })
    .catch(function (err) {
      console.error(err);
      alert('সেভ করা যায়নি: ' + (err.message || 'অজানা সমস্যা'));
      btn.disabled = false;
      btn.textContent = '✅ সেভ করুন';
    });
}

function deleteOpinion(btn) {
  var card = btn.closest('.card');
  var id = card.dataset.id;
  var name = card.querySelector('.name').textContent;
  if (!confirm('"' + name + '" এর মতামতটি স্থায়ীভাবে ডিলিট করতে চান?')) return;

  btn.disabled = true;
  btn.textContent = 'ডিলিট হচ্ছে...';

  db.collection('opinions').doc(id).delete()
    .then(function () {
      card.remove();
    })
    .catch(function (err) {
      console.error(err);
      alert('ডিলিট করা যায়নি: ' + (err.message || 'অজানা সমস্যা'));
      btn.disabled = false;
      btn.textContent = '🗑️ ডিলিট';
    });
}

loadOpinions();
</script>

</body>
</html>
