<!-- ============================================================
  এই পুরো অংশটুকু index.html এর "খবরাখবর" সেকশনে বসিয়ে দিন।
  পুরনো স্ট্যাটিক নোটিশগুলোর জায়গায় অথবা সেগুলোর নিচে বসাতে পারেন।
============================================================ -->

<section id="notice" style="padding: 60px 20px; background: #d6cdb2;">
  <div style="max-width: 900px; margin: 0 auto;">
    
    <!-- সেকশন হেডার -->
    <div style="text-align: center; margin-bottom: 40px;">
      <span style="display:inline-block; font-size:0.8rem; letter-spacing:3px; text-transform:uppercase; color:#b84a42; margin-bottom:10px;">খবরাখবর</span>
      <h2 style="font-family:'Baloo Da 2',sans-serif; font-size:clamp(1.8rem,4vw,2.5rem); color:#12261a; margin:0 0 12px;">গ্রামের সাম্প্রতিক ঘোষণা</h2>
      <p style="color:#3f382c; font-size:1.05rem; max-width:560px; margin:0 auto;">উন্নয়নমূলক কাজ, সামাজিক আয়োজন ও গ্রামের গুরুত্বপূর্ণ খবর এখানে জানানো হয়।</p>
    </div>

    <!-- Firebase থেকে পোস্ট লোড হবে এখানে -->
    <div id="posts-container">
      <p style="text-align:center; color:#666; padding:30px 0;">লোড হচ্ছে...</p>
    </div>

  </div>
</section>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyBqiOcn85zgvzDXt_Y60e3CQDEpdlYRBQ0",
    authDomain: "amader-joginibari.firebaseapp.com",
    projectId: "amader-joginibari",
    storageBucket: "amader-joginibari.firebasestorage.app",
    messagingSenderId: "917158468104",
    appId: "1:917158468104:web:039539cca785319febcfbd",
    measurementId: "G-SK4FHVPSTE"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  function extractYouTubeId(link) {
    if (!link) return null;
    const match = link.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/watch\?.+&v=))([\w-]{11})/);
    return match ? match[1] : null;
  }

  function formatDate(timestamp) {
    if (!timestamp || !timestamp.toDate) return "";
    try {
      return timestamp.toDate().toLocaleDateString("bn-BD", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    } catch (e) {
      return "";
    }
  }

  db.collection("posts")
    .orderBy("createdAt", "desc")
    .get()
    .then(function(snapshot) {
      var container = document.getElementById("posts-container");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = '<p style="text-align:center; color:#666; padding:40px 0; font-size:1.05rem;">এখনো কোনো নোটিশ নেই। শীঘ্রই নতুন খবর আসবে।</p>';
        return;
      }

      snapshot.forEach(function(doc) {
        var d = doc.data();
        var card = document.createElement("div");
        card.style.cssText = "background:#faf8f2; border:1px solid #e5e0d5; border-radius:12px; padding:22px; margin-bottom:20px; box-shadow:0 4px 14px rgba(18,38,26,0.06);";

        var html = "";

        // তারিখ
        if (d.createdAt) {
          html += '<div style="font-size:0.82rem; color:#b84a42; margin-bottom:10px; letter-spacing:0.5px;">' + formatDate(d.createdAt) + '</div>';
        }

        // টেক্সট
        if (d.text) {
          html += '<p style="margin:0 0 14px; line-height:1.75; color:#1a1610; font-size:1.05rem; white-space:pre-wrap;">' + d.text + '</p>';
        }

        // ছবি
        if (d.imageLink) {
          html += '<img src="' + d.imageLink + '" alt="নোটিশ ছবি" style="width:100%; max-height:420px; object-fit:cover; border-radius:10px; margin-bottom:14px; display:block;" loading="lazy" onerror="this.style.display=\'none\'">';
        }

        // ইউটিউব ভিডিও
        if (d.videoLink) {
          var videoId = extractYouTubeId(d.videoLink);
          if (videoId) {
            html += '<div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px; background:#000;">' +
              '<iframe src="https://www.youtube.com/embed/' + videoId + '" ' +
              'style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" ' +
              'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
              'allowfullscreen loading="lazy"></iframe></div>';
          }
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    })
    .catch(function(err) {
      console.error("পোস্ট লোড করতে সমস্যা:", err);
      document.getElementById("posts-container").innerHTML =
        '<p style="text-align:center; color:#b84a42; padding:30px 0;">ডেটা লোড করতে সমস্যা হয়েছে। পরে আবার চেষ্টা করুন।</p>';
    });
})();
</script>
