<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>অ্যাডমিন — আমাদের যোগিনী বাড়ী</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:#f3efe6;color:#1a1610;min-height:100vh;padding:16px;line-height:1.5}
    .box{max-width:520px;margin:0 auto 18px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.08);border:1px solid #e5e0d5}
    h1{text-align:center;font-size:1.25rem;color:#1f4a32;margin-bottom:6px}
    .sub{text-align:center;font-size:.82rem;color:#6b6358;margin-bottom:18px}
    label{display:block;font-size:.82rem;font-weight:600;color:#5c5346;margin:14px 0 6px}
    input,textarea,select,button{font-family:inherit;font-size:15px}
    input,textarea{width:100%;padding:12px 14px;border:1.5px solid #d0c8b4;border-radius:10px;background:#faf8f2}
    input:focus,textarea:focus{outline:none;border-color:#1f4a32;background:#fff}
    textarea{min-height:90px;resize:vertical}
    .btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px}
    .btn-green{background:#1f4a32;color:#fff}
    .btn-green:hover{background:#163326}
    .btn-green:disabled{opacity:.6;cursor:not-allowed}
    .btn-red{background:#b84a42;color:#fff;margin-top:10px}
    .btn-sm{width:auto;padding:7px 14px;font-size:13px}
    .msg{text-align:center;font-weight:600;font-size:.9rem;margin-top:12px;min-height:22px}
    .ok{color:#1f4a32}.err{color:#b84a42}.info{color:#5c5346}
    .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
    .tab{flex:1;min-width:70px;padding:9px 6px;border:1.5px solid #d0c8b4;border-radius:8px;background:#faf8f2;font-size:.8rem;font-weight:600;cursor:pointer;text-align:center;color:#5c5346}
    .tab.on{background:#1f4a32;border-color:#1f4a32;color:#fff}
    .drop{border:2px dashed #d0c8b4;border-radius:12px;padding:24px 12px;text-align:center;background:#faf8f2;cursor:pointer}
    .drop:hover,.drop.over{border-color:#1f4a32;background:#eef5f0}
    .drop input{display:none}
    .hint{font-size:.75rem;color:#8a8070;margin-top:6px}
    .preview{margin-top:12px}
    .preview img{max-width:100%;max-height:200px;border-radius:10px;display:block;margin:0 auto}
    .preview .name{font-size:.8rem;color:#5c5346;text-align:center;margin-top:6px}
    .bar{height:6px;background:#e5e0d5;border-radius:3px;margin-top:12px;overflow:hidden;display:none}
    .bar.show{display:block}
    .bar>i{display:block;height:100%;background:#1f4a32;width:0%;transition:width .25s}
    .post{border-bottom:1px solid #eee;padding:14px 0}
    .post:last-child{border-bottom:none}
    .post .d{font-size:.75rem;color:#b84a42;margin-bottom:4px}
    .post .t{font-size:.92rem;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
    .post img{max-width:100%;max-height:140px;border-radius:8px;margin-bottom:8px}
    .empty{text-align:center;color:#8a8070;padding:20px 0}
    .user{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:#6b6358;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #eee}
    .hidden{display:none!important}
  </style>
</head>
<body>

<div class="box" id="loginBox">
  <h1>🔐 অ্যাডমিন লগইন</h1>
  <p class="sub">আমাদের যোগিনী বাড়ী</p>
  <label>ইমেইল</label>
  <input type="email" id="email" placeholder="ইমেইল" autocomplete="email">
  <label>পাসওয়ার্ড</label>
  <input type="password" id="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
  <button class="btn btn-green" id="loginBtn" onclick="doLogin()">লগইন করুন</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="mainBox" class="hidden">
  <div class="box">
    <div class="user">
      <span id="userEmail">—</span>
      <button class="btn btn-red btn-sm" onclick="doLogout()">লগআউট</button>
    </div>
    <h1 style="text-align:left;font-size:1.1rem;margin-bottom:4px">নতুন আপডেট</h1>

    <label>শিরোনাম (ঐচ্ছিক)</label>
    <input type="text" id="title" placeholder="শিরোনাম লিখুন">

    <label>টেক্সট / নোটিশ</label>
    <textarea id="text" placeholder="নোটিশ লিখুন..."></textarea>

    <label>কী যোগ করবেন?</label>
    <div class="tabs">
      <button type="button" class="tab on" data-t="none" onclick="setTab('none')">শুধু টেক্সট</button>
      <button type="button" class="tab" data-t="image" onclick="setTab('image')">ছবি</button>
      <button type="button" class="tab" data-t="video" onclick="setTab('video')">ভিডিও</button>
      <button type="button" class="tab" data-t="link" onclick="setTab('link')">লিংক</button>
      <button type="button" class="tab" data-t="file" onclick="setTab('file')">ফাইল/PDF</button>
    </div>

    <div id="panel-image" class="hidden">
      <div class="drop" id="dropImg" onclick="document.getElementById('fileImg').click()">
        <div style="font-size:1.8rem">🖼️</div>
        <div>ছবি সিলেক্ট করুন</div>
        <div class="hint">অটো কম্প্রেস হবে · অথবা নিচে URL দিন</div>
        <input type="file" id="fileImg" accept="image/*">
      </div>
      <div class="preview" id="prevImg"></div>
      <label>অথবা ছবির লিংক (URL)</label>
      <input type="url" id="imgUrl" placeholder="https://...">
    </div>

    <div id="panel-video" class="hidden">
      <div class="drop" id="dropVid" onclick="document.getElementById('fileVid').click()">
        <div style="font-size:1.8rem">🎬</div>
        <div>ভিডিও ফাইল সিলেক্ট</div>
        <div class="hint">MP4 ইত্যাদি · অথবা নিচে ইউটিউব লিংক</div>
        <input type="file" id="fileVid" accept="video/*">
      </div>
      <div class="preview" id="prevVid"></div>
      <label>অথবা ইউটিউব / ভিডিও লিংক</label>
      <input type="url" id="vidUrl" placeholder="https://youtube.com/...">
    </div>

    <div id="panel-link" class="hidden">
      <label>যেকোনো লিংক</label>
      <input type="url" id="extLink" placeholder="https://...">
    </div>

    <div id="panel-file" class="hidden">
      <div class="drop" id="dropFile" onclick="document.getElementById('fileAny').click()">
        <div style="font-size:1.8rem">📎</div>
        <div>PDF / ফাইল সিলেক্ট</div>
        <div class="hint">PDF, DOC, ZIP ইত্যাদি</div>
        <input type="file" id="fileAny" accept="*/*">
      </div>
      <div class="preview" id="prevFile"></div>
    </div>

    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="msg info" id="progText"></div>

    <button class="btn btn-green" id="submitBtn" onclick="doSubmit()">সাবমিট করুন</button>
    <div class="msg" id="submitMsg"></div>
  </div>

  <div class="box">
    <h1 style="text-align:left;font-size:1.1rem;margin-bottom:12px">পুরনো আপডেট</h1>
    <div id="list"><div class="empty">লোড হচ্ছে...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
(function(){
  var cfg = {
    apiKey: "AIzaSyBqiOcn85zgvzDXt_Y60e3CQDEpdlYRBQ0",
    authDomain: "amader-joginibari.firebaseapp.com",
    projectId: "amader-joginibari",
    storageBucket: "amader-joginibari.firebasestorage.app",
    messagingSenderId: "917158468104",
    appId: "1:917158468104:web:039539cca785319febcfbd",
    measurementId: "G-SK4FHVPSTE"
  };

  firebase.initializeApp(cfg);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var storage = firebase.storage();

  var tab = 'none';
  var pickedFile = null;
  var busy = false;

  auth.onAuthStateChanged(function(u){
    if(u){
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('mainBox').classList.remove('hidden');
      document.getElementById('userEmail').textContent = u.email || 'Admin';
      loadList();
    } else {
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('mainBox').classList.add('hidden');
    }
  });

  window.doLogin = function(){
    var e = document.getElementById('email').value.trim();
    var p = document.getElementById('password').value;
    var m = document.getElementById('loginMsg');
    var b = document.getElementById('loginBtn');
    if(!e||!p){ m.className='msg err'; m.textContent='ইমেইল ও পাসওয়ার্ড দিন'; return; }
    b.disabled = true; b.textContent = 'লগইন হচ্ছে...'; m.textContent='';
    auth.signInWithEmailAndPassword(e,p).catch(function(err){
      m.className='msg err'; m.textContent='ভুল ইমেইল বা পাসওয়ার্ড';
      console.error(err);
    }).finally(function(){ b.disabled=false; b.textContent='লগইন করুন'; });
  };

  window.doLogout = function(){ auth.signOut(); };

  document.getElementById('password').addEventListener('keydown', function(ev){
    if(ev.key==='Enter') doLogin();
  });

  window.setTab = function(t){
    tab = t;
    document.querySelectorAll('.tab').forEach(function(el){
      el.classList.toggle('on', el.getAttribute('data-t')===t);
    });
    ['image','video','link','file'].forEach(function(x){
      document.getElementById('panel-'+x).classList.toggle('hidden', x!==t);
    });
    pickedFile = null;
    ['prevImg','prevVid','prevFile'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.innerHTML='';
    });
  };

  function bindFile(inputId, prevId, dropId){
    var inp = document.getElementById(inputId);
    var drop = document.getElementById(dropId);
    inp.addEventListener('change', function(){
      if(inp.files && inp.files[0]) handlePick(inp.files[0], prevId);
      inp.value='';
    });
    if(drop){
      drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
      drop.addEventListener('drop', function(e){
        e.preventDefault(); drop.classList.remove('over');
        if(e.dataTransfer.files[0]) handlePick(e.dataTransfer.files[0], prevId);
      });
    }
  }
  bindFile('fileImg','prevImg','dropImg');
  bindFile('fileVid','prevVid','dropVid');
  bindFile('fileAny','prevFile','dropFile');

  function handlePick(file, prevId){
    pickedFile = file;
    var prev = document.getElementById(prevId);
    var size = (file.size/1024).toFixed(0) + ' KB';
    if(file.type.indexOf('image/')===0){
      var url = URL.createObjectURL(file);
      prev.innerHTML = '<img src="'+url+'"><div class="name">'+esc(file.name)+' · '+size+'</div>';
    } else {
      prev.innerHTML = '<div class="name">📎 '+esc(file.name)+' · '+size+'</div>';
    }
  }

  function compressImage(file){
    return new Promise(function(resolve){
      if(!file.type || file.type.indexOf('image/')!==0){ resolve(file); return; }
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w=img.width, h=img.height, max=1600;
        if(w>max || h>max){
          if(w>h){ h=Math.round(h*max/w); w=max; }
          else { w=Math.round(w*max/h); h=max; }
        }
        var c=document.createElement('canvas');
        c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(function(blob){
          if(!blob){ resolve(file); return; }
          resolve(new File([blob], file.name.replace(/\.\w+$/,'.jpg'), {type:'image/jpeg'}));
        }, 'image/jpeg', 0.72);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function uploadFile(file){
    return new Promise(function(resolve, reject){
      var ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      var path = 'posts/' + Date.now() + '_' + Math.random().toString(36).slice(2,7) + '.' + ext;
      var ref = storage.ref(path);
      var task = ref.put(file, { contentType: file.type || 'application/octet-stream' });
      task.on('state_changed',
        function(s){
          var pct = Math.round((s.bytesTransferred / s.totalBytes) * 100);
          document.getElementById('barFill').style.width = pct + '%';
          document.getElementById('progText').textContent = 'আপলোড ' + pct + '%';
        },
        function(err){ reject(err); },
        function(){
          task.snapshot.ref.getDownloadURL().then(resolve).catch(reject);
        }
      );
    });
  }

  window.doSubmit = async function(){
    if(busy) return;
    var title = document.getElementById('title').value.trim();
    var text = document.getElementById('text').value.trim();
    var msg = document.getElementById('submitMsg');
    var btn = document.getElementById('submitBtn');
    var bar = document.getElementById('bar');
    var prog = document.getElementById('progText');

    var imgUrl = document.getElementById('imgUrl').value.trim();
    var vidUrl = document.getElementById('vidUrl').value.trim();
    var extLink = document.getElementById('extLink').value.trim();

    var hasSomething = title || text || pickedFile || imgUrl || vidUrl || extLink;
    if(!hasSomething){
      msg.className='msg err'; msg.textContent='কমপক্ষে কিছু লিখুন বা ফাইল/লিংক দিন';
      return;
    }

    busy = true;
    btn.disabled = true;
    btn.textContent = 'সেভ হচ্ছে...';
    msg.textContent = '';
    bar.classList.add('show');
    document.getElementById('barFill').style.width = '5%';
    prog.textContent = 'প্রস্তুত...';

    try {
      var media = [];

      if(pickedFile){
        prog.textContent = 'ফাইল প্রসেস হচ্ছে...';
        var fileToUp = pickedFile;
        if(tab==='image' || (pickedFile.type && pickedFile.type.indexOf('image/')===0)){
          prog.textContent = 'ছবি কম্প্রেস হচ্ছে...';
          fileToUp = await compressImage(pickedFile);
          prog.textContent = 'কম্প্রেস: ' + (pickedFile.size/1024).toFixed(0) + 'KB → ' + (fileToUp.size/1024).toFixed(0) + 'KB';
        }
        prog.textContent = 'আপলোড শুরু...';
        var url = await uploadFile(fileToUp);
        var mtype = 'file';
        if(tab==='image' || (pickedFile.type||'').indexOf('image/')===0) mtype = 'image';
        else if(tab==='video' || (pickedFile.type||'').indexOf('video/')===0) mtype = 'video';
        else if(tab==='file' && (pickedFile.type==='application/pdf' || /\.pdf$/i.test(pickedFile.name))) mtype = 'pdf';
        media.push({ type: mtype, url: url, name: pickedFile.name, size: fileToUp.size });
      }

      if(tab==='image' && imgUrl && !pickedFile){
        media.push({ type: 'image', url: imgUrl, name: 'Image URL' });
      }
      if(tab==='video' && vidUrl && !pickedFile){
        var isYt = /youtu\.?be|youtube\.com/i.test(vidUrl);
        media.push({ type: isYt ? 'youtube' : 'link', url: vidUrl, name: isYt ? 'YouTube' : 'Video Link' });
      }
      if(tab==='link' && extLink){
        var isYt2 = /youtu\.?be|youtube\.com/i.test(extLink);
        media.push({ type: isYt2 ? 'youtube' : 'link', url: extLink, name: isYt2 ? 'YouTube' : 'Link' });
      }

      document.getElementById('barFill').style.width = '90%';
      prog.textContent = 'ডেটাবেসে সেভ হচ্ছে...';

      var data = {
        title: title || '',
        text: text || '',
        media: media,
        imageLink: (media.find(function(m){return m.type==='image';}) || {}).url || '',
        videoLink: (media.find(function(m){return m.type==='youtube'||m.type==='video';}) || {}).url || '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection('posts').add(data);

      document.getElementById('barFill').style.width = '100%';
      prog.textContent = '';
      msg.className = 'msg ok';
      msg.textContent = '✅ সফলভাবে যোগ হয়েছে!';

      document.getElementById('title').value = '';
      document.getElementById('text').value = '';
      document.getElementById('imgUrl').value = '';
      document.getElementById('vidUrl').value = '';
      document.getElementById('extLink').value = '';
      pickedFile = null;
      ['prevImg','prevVid','prevFile'].forEach(function(id){ document.getElementById(id).innerHTML=''; });
      setTab('none');

      setTimeout(function(){ bar.classList.remove('show'); loadList(); }, 800);

    } catch(err) {
      console.error(err);
      var t = (err && err.message) ? err.message : 'অজানা সমস্যা';
      var code = (err && err.code) ? err.code : '';
      if(/unauthorized|permission/i.test(t) || code==='storage/unauthorized'){
        t = 'Storage অনুমতি নেই। Firebase Console → Storage → Rules এ allow write: if request.auth != null; দিয়ে Publish করুন।';
      } else if(/quota|retry-limit|network/i.test(t)){
        t = 'নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন। অথবা ছবির URL ব্যবহার করুন।';
      } else if(code==='storage/unknown' || /bucket/i.test(t)){
        t = 'Storage চালু নেই। Firebase Console → Storage → Get started করুন।';
      }
      msg.className = 'msg err';
      msg.textContent = '❌ ' + t;
      bar.classList.remove('show');
      prog.textContent = '';
    } finally {
      busy = false;
      btn.disabled = false;
      btn.textContent = 'সাবমিট করুন';
    }
  };

  function loadList(){
    var list = document.getElementById('list');
    list.innerHTML = '<div class="empty">লোড হচ্ছে...</div>';
    db.collection('posts').orderBy('createdAt','desc').limit(40).get()
      .then(function(snap){
        if(snap.empty){ list.innerHTML='<div class="empty">কোনো পোস্ট নেই</div>'; return; }
        list.innerHTML = '';
        snap.forEach(function(doc){
          var d = doc.data();
          var div = document.createElement('div');
          div.className = 'post';
          var h = '';
          if(d.createdAt && d.createdAt.toDate){
            h += '<div class="d">'+d.createdAt.toDate().toLocaleString('bn-BD')+'</div>';
          }
          if(d.title) h += '<div style="font-weight:700;margin-bottom:4px">'+esc(d.title)+'</div>';
          if(d.text) h += '<div class="t">'+esc(d.text)+'</div>';
          if(d.media && d.media.length){
            d.media.forEach(function(m){
              if(m.type==='image') h += '<img src="'+esc(m.url)+'" onerror="this.style.display=\'none\'">';
              else h += '<div class="hint">'+esc(m.type)+': '+esc(m.name||m.url)+'</div>';
            });
          } else if(d.imageLink){
            h += '<img src="'+esc(d.imageLink)+'" onerror="this.style.display=\'none\'">';
          }
          h += '<button class="btn btn-red btn-sm" onclick="delPost(\''+doc.id+'\')">ডিলিট</button>';
          div.innerHTML = h;
          list.appendChild(div);
        });
      })
      .catch(function(e){
        console.error(e);
        list.innerHTML = '<div class="empty" style="color:#b84a42">লোড ব্যর্থ</div>';
      });
  }

  window.delPost = function(id){
    if(!confirm('ডিলিট করবেন?')) return;
    db.collection('posts').doc(id).delete().then(loadList);
  };

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
