<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>অ্যাডমিন — আমাদের যোগিনী বাড়ী</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:#f3efe6;color:#1a1610;min-height:100vh;padding:16px;line-height:1.5}
.box{max-width:520px;margin:0 auto 16px;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);border:1px solid #e5e0d5}
h1{font-size:1.15rem;color:#1f4a32;margin-bottom:4px}
.sub{font-size:.8rem;color:#6b6358;margin-bottom:14px;text-align:center}
label{display:block;font-size:.8rem;font-weight:600;color:#5c5346;margin:12px 0 5px}
input,textarea,button{font-family:inherit;font-size:15px}
input,textarea{width:100%;padding:11px 13px;border:1.5px solid #d0c8b4;border-radius:10px;background:#faf8f2}
input:focus,textarea:focus{outline:none;border-color:#1f4a32;background:#fff}
textarea{min-height:88px;resize:vertical}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-green{background:#1f4a32;color:#fff}
.btn-green:disabled{opacity:.55;cursor:not-allowed}
.btn-red{background:#b84a42;color:#fff}
.btn-sm{width:auto;padding:6px 12px;font-size:13px;margin-top:6px}
.msg{text-align:center;font-weight:600;font-size:.85rem;margin-top:10px;min-height:20px;word-break:break-word}
.ok{color:#1f4a32}.err{color:#b84a42}.info{color:#5c5346}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.tab{flex:1;min-width:64px;padding:8px 4px;border:1.5px solid #d0c8b4;border-radius:8px;background:#faf8f2;font-size:.75rem;font-weight:600;cursor:pointer;text-align:center;color:#5c5346}
.tab.on{background:#1f4a32;border-color:#1f4a32;color:#fff}
.drop{border:2px dashed #d0c8b4;border-radius:12px;padding:20px 10px;text-align:center;background:#faf8f2;cursor:pointer}
.drop:hover,.drop.over{border-color:#1f4a32;background:#eef5f0}
.drop input{display:none}
.hint{font-size:.72rem;color:#8a8070;margin-top:5px}
.preview{margin-top:10px}
.preview img{max-width:100%;max-height:180px;border-radius:10px;display:block;margin:0 auto}
.preview .name{font-size:.78rem;color:#5c5346;text-align:center;margin-top:5px}
.bar{height:6px;background:#e5e0d5;border-radius:3px;margin-top:10px;overflow:hidden;display:none}
.bar.show{display:block}
.bar>i{display:block;height:100%;background:#1f4a32;width:0%;transition:width .2s}
.post{border-bottom:1px solid #eee;padding:12px 0}
.post .d{font-size:.72rem;color:#b84a42;margin-bottom:3px}
.post .t{font-size:.9rem;white-space:pre-wrap;word-break:break-word;margin-bottom:6px}
.post img{max-width:100%;max-height:120px;border-radius:8px;margin-bottom:6px}
.empty{text-align:center;color:#8a8070;padding:16px 0}
.user{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#6b6358;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eee}
.hidden{display:none!important}
.note{background:#eef5f0;border:1px solid #c5d9cc;border-radius:8px;padding:8px 10px;font-size:.75rem;color:#1f4a32;margin-top:8px}
</style>
</head>
<body>

<div class="box" id="loginBox">
  <h1 style="text-align:center">🔐 অ্যাডমিন লগইন</h1>
  <p class="sub">আমাদের যোগিনী বাড়ী</p>
  <label>ইমেইল</label>
  <input type="email" id="email" placeholder="ইমেইল" autocomplete="email">
  <label>পাসওয়ার্ড</label>
  <input type="password" id="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
  <button class="btn btn-green" id="loginBtn" onclick="doLogin()">লগইন করুন</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="mainBox" class="hidden">
  <div class="box">
    <div class="user">
      <span id="userEmail">—</span>
      <button class="btn btn-red btn-sm" onclick="doLogout()">লগআউট</button>
    </div>
    <h1>নতুন আপডেট</h1>

    <label>শিরোনাম (ঐচ্ছিক)</label>
    <input type="text" id="title" placeholder="শিরোনাম">

    <label>টেক্সট / নোটিশ</label>
    <textarea id="text" placeholder="নোটিশ লিখুন..."></textarea>

    <label>মিডিয়া</label>
    <div class="tabs">
      <button type="button" class="tab on" data-t="none" onclick="setTab('none')">শুধু টেক্সট</button>
      <button type="button" class="tab" data-t="image" onclick="setTab('image')">ছবি</button>
      <button type="button" class="tab" data-t="video" onclick="setTab('video')">ভিডিও লিংক</button>
      <button type="button" class="tab" data-t="link" onclick="setTab('link')">লিংক</button>
    </div>

    <div id="panel-image" class="hidden">
      <div class="drop" id="dropImg" onclick="document.getElementById('fileImg').click()">
        <div style="font-size:1.6rem">🖼️</div>
        <div><b>ছবি সিলেক্ট করুন</b></div>
        <div class="hint">JPG / PNG — অটো কম্প্রেস</div>
        <input type="file" id="fileImg" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp">
      </div>
      <div class="preview" id="prevImg"></div>
      <label>অথবা ছবির URL (ঐচ্ছিক)</label>
      <input type="url" id="imgUrl" placeholder="https://example.com/photo.jpg">
      <div class="note">ফাইল সিলেক্ট করলে URL খালি রাখুন। শুধু একটি ব্যবহার করুন।</div>
    </div>

    <div id="panel-video" class="hidden">
      <label>ইউটিউব / ভিডিও লিংক</label>
      <input type="url" id="vidUrl" placeholder="https://youtube.com/watch?v=...">
    </div>

    <div id="panel-link" class="hidden">
      <label>যেকোনো লিংক</label>
      <input type="url" id="extLink" placeholder="https://...">
    </div>

    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="msg info" id="progText"></div>
    <button class="btn btn-green" id="submitBtn" onclick="doSubmit()">সাবমিট করুন</button>
    <div class="msg" id="submitMsg"></div>
  </div>

  <div class="box">
    <h1 style="margin-bottom:10px">পুরনো আপডেট</h1>
    <div id="list"><div class="empty">লোড হচ্ছে...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var cfg = {
    apiKey: "AIzaSyBqiOcn85zgvzDXt_Y60e3CQDEpdlYRBQ0",
    authDomain: "amader-joginibari.firebaseapp.com",
    projectId: "amader-joginibari",
    storageBucket: "amader-joginibari.firebasestorage.app",
    messagingSenderId: "917158468104",
    appId: "1:917158468104:web:039539cca785319febcfbd",
    measurementId: "G-SK4FHVPSTE"
  };
  firebase.initializeApp(cfg);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var tab = 'none';
  var pickedFile = null;
  var busy = false;

  auth.onAuthStateChanged(function(u){
    if(u){
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('mainBox').classList.remove('hidden');
      document.getElementById('userEmail').textContent = u.email || 'Admin';
      loadList();
    } else {
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('mainBox').classList.add('hidden');
    }
  });

  window.doLogin = function(){
    var e = document.getElementById('email').value.trim();
    var p = document.getElementById('password').value;
    var m = document.getElementById('loginMsg');
    var b = document.getElementById('loginBtn');
    if(!e||!p){ m.className='msg err'; m.textContent='ইমেইল ও পাসওয়ার্ড দিন'; return; }
    b.disabled=true; b.textContent='লগইন হচ্ছে...'; m.textContent='';
    auth.signInWithEmailAndPassword(e,p)
      .catch(function(){ m.className='msg err'; m.textContent='ভুল ইমেইল বা পাসওয়ার্ড'; })
      .finally(function(){ b.disabled=false; b.textContent='লগইন করুন'; });
  };
  window.doLogout = function(){ auth.signOut(); };
  document.getElementById('password').addEventListener('keydown', function(ev){
    if(ev.key==='Enter') doLogin();
  });

  window.setTab = function(t){
    tab = t;
    document.querySelectorAll('.tab').forEach(function(el){
      el.classList.toggle('on', el.getAttribute('data-t')===t);
    });
    ['image','video','link'].forEach(function(x){
      document.getElementById('panel-'+x).classList.toggle('hidden', x!==t);
    });
    pickedFile = null;
    var p = document.getElementById('prevImg'); if(p) p.innerHTML='';
  };

  var fileImg = document.getElementById('fileImg');
  var dropImg = document.getElementById('dropImg');
  fileImg.addEventListener('change', function(){
    if(fileImg.files && fileImg.files[0]) handlePick(fileImg.files[0]);
    fileImg.value = '';
  });
  dropImg.addEventListener('dragover', function(e){ e.preventDefault(); dropImg.classList.add('over'); });
  dropImg.addEventListener('dragleave', function(){ dropImg.classList.remove('over'); });
  dropImg.addEventListener('drop', function(e){
    e.preventDefault(); dropImg.classList.remove('over');
    if(e.dataTransfer.files[0]) handlePick(e.dataTransfer.files[0]);
  });

  function handlePick(file){
    // accept common image types; some phones leave type empty
    var ok = !file.type || file.type.indexOf('image/')===0 || /\.(jpe?g|png|webp|gif)$/i.test(file.name);
    if(!ok){
      alert('শুধু ছবি ফাইল দিন (JPG, PNG)');
      return;
    }
    pickedFile = file;
    // clear bad URL so it doesn't interfere
    document.getElementById('imgUrl').value = '';
    var prev = document.getElementById('prevImg');
    var size = (file.size/1024).toFixed(0) + ' KB';
    // preview via FileReader (more reliable on mobile than object URL sometimes)
    var reader = new FileReader();
    reader.onload = function(){
      prev.innerHTML = '<img src="'+reader.result+'"><div class="name">'+esc(file.name)+' · '+size+' (কম্প্রেস হবে)</div>';
    };
    reader.onerror = function(){
      prev.innerHTML = '<div class="name">'+esc(file.name)+' · '+size+' (প্রিভিউ যায়নি, সাবমিট চেষ্টা করুন)</div>';
    };
    reader.readAsDataURL(file);
  }

  // Robust load: FileReader first, then object URL fallback
  function loadImageElement(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){
        // fallback object URL
        var u = URL.createObjectURL(file);
        var img2 = new Image();
        img2.onload = function(){ URL.revokeObjectURL(u); resolve(img2); };
        img2.onerror = function(){ URL.revokeObjectURL(u); reject(new Error('ছবি পড়া যায়নি। অন্য JPG/PNG চেষ্টা করুন।')); };
        img2.src = u;
      };
      var r = new FileReader();
      r.onload = function(){ img.src = r.result; };
      r.onerror = function(){
        var u = URL.createObjectURL(file);
        img.onerror = function(){ URL.revokeObjectURL(u); reject(new Error('ছবি পড়া যায়নি। অন্য JPG/PNG চেষ্টা করুন।')); };
        img.onload = function(){ URL.revokeObjectURL(u); resolve(img); };
        img.src = u;
      };
      r.readAsDataURL(file);
    });
  }

  function compressImage(file){
    return loadImageElement(file).then(function(img){
      return new Promise(function(resolve, reject){
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        if(!w || !h){ reject(new Error('ছবির সাইজ পাওয়া যায়নি')); return; }

        var max = 1200;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        function encode(q, attempt){
          try {
            var dataUrl = canvas.toDataURL('image/jpeg', q);
            // approximate binary size from base64
            var approx = Math.round((dataUrl.length - 22) * 0.75);
            if(approx > 200 * 1024 && q > 0.4 && attempt < 6){
              encode(q - 0.1, attempt + 1);
              return;
            }
            if(approx > 280 * 1024 && canvas.width > 700 && attempt < 8){
              var nw = Math.round(canvas.width * 0.75);
              var nh = Math.round(canvas.height * 0.75);
              var c2 = document.createElement('canvas');
              c2.width = nw; c2.height = nh;
              c2.getContext('2d').drawImage(canvas, 0, 0, nw, nh);
              canvas = c2;
              encode(Math.max(0.45, q - 0.05), attempt + 1);
              return;
            }
            resolve({ dataUrl: dataUrl, size: approx, width: canvas.width, height: canvas.height });
          } catch(e){
            reject(new Error('কম্প্রেস ব্যর্থ: ' + (e.message || '')));
          }
        }
        encode(0.72, 0);
      });
    });
  }

  window.doSubmit = async function(){
    if(busy) return;
    var title = document.getElementById('title').value.trim();
    var text = document.getElementById('text').value.trim();
    var imgUrl = document.getElementById('imgUrl').value.trim();
    var vidUrl = document.getElementById('vidUrl').value.trim();
    var extLink = document.getElementById('extLink').value.trim();
    var msg = document.getElementById('submitMsg');
    var btn = document.getElementById('submitBtn');
    var bar = document.getElementById('bar');
    var prog = document.getElementById('progText');

    // ignore invalid imgUrl (must start with http)
    if(imgUrl && !/^https?:\/\//i.test(imgUrl)){
      imgUrl = '';
      document.getElementById('imgUrl').value = '';
    }

    if(!(title || text || pickedFile || imgUrl || vidUrl || extLink)){
      msg.className='msg err'; msg.textContent='কমপক্ষে টেক্সট, ছবি বা লিংক দিন';
      return;
    }

    busy = true;
    btn.disabled = true;
    btn.textContent = 'সেভ হচ্ছে...';
    msg.textContent = '';
    bar.classList.add('show');
    document.getElementById('barFill').style.width = '10%';
    prog.textContent = 'শুরু...';

    try {
      var media = [];
      var imageLink = '';
      var videoLink = '';

      if(pickedFile){
        prog.textContent = 'ছবি প্রসেস হচ্ছে...';
        document.getElementById('barFill').style.width = '30%';
        var before = pickedFile.size;
        var result = await compressImage(pickedFile);
        prog.textContent = 'কম্প্রেস: ' + (before/1024).toFixed(0) + ' KB → ' + (result.size/1024).toFixed(0) + ' KB';
        document.getElementById('barFill').style.width = '70%';

        if(result.size > 700 * 1024){
          throw new Error('ছবি এখনো বড়। অন্য ছবি দিন।');
        }
        media.push({ type: 'image', url: result.dataUrl, name: pickedFile.name, size: result.size });
        imageLink = result.dataUrl;
      } else if(tab === 'image' && imgUrl){
        media.push({ type: 'image', url: imgUrl, name: 'Image URL' });
        imageLink = imgUrl;
      }

      if(tab === 'video' && vidUrl){
        var isYt = /youtu\.?be|youtube\.com/i.test(vidUrl);
        media.push({ type: isYt ? 'youtube' : 'link', url: vidUrl, name: isYt ? 'YouTube' : 'Video' });
        videoLink = vidUrl;
      }
      if(tab === 'link' && extLink){
        var isYt2 = /youtu\.?be|youtube\.com/i.test(extLink);
        media.push({ type: isYt2 ? 'youtube' : 'link', url: extLink, name: isYt2 ? 'YouTube' : 'Link' });
        if(isYt2) videoLink = extLink;
      }

      prog.textContent = 'ডেটাবেসে সেভ হচ্ছে...';
      document.getElementById('barFill').style.width = '90%';

      await db.collection('posts').add({
        title: title || '',
        text: text || '',
        media: media,
        imageLink: imageLink,
        videoLink: videoLink,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('barFill').style.width = '100%';
      prog.textContent = '';
      msg.className = 'msg ok';
      msg.textContent = '✅ সফলভাবে সেভ হয়েছে!';

      document.getElementById('title').value = '';
      document.getElementById('text').value = '';
      document.getElementById('imgUrl').value = '';
      document.getElementById('vidUrl').value = '';
      document.getElementById('extLink').value = '';
      pickedFile = null;
      document.getElementById('prevImg').innerHTML = '';
      setTab('none');
      setTimeout(function(){ bar.classList.remove('show'); loadList(); }, 600);

    } catch(err){
      console.error(err);
      var t = (err && err.message) ? err.message : 'সমস্যা হয়েছে';
      if(/permission|Permission/i.test(t)){
        t = 'Firestore অনুমতি নেই। Firebase Rules চেক করুন।';
      }
      msg.className = 'msg err';
      msg.textContent = '❌ ' + t;
      bar.classList.remove('show');
      prog.textContent = '';
    } finally {
      busy = false;
      btn.disabled = false;
      btn.textContent = 'সাবমিট করুন';
    }
  };

  function loadList(){
    var list = document.getElementById('list');
    list.innerHTML = '<div class="empty">লোড হচ্ছে...</div>';
    db.collection('posts').orderBy('createdAt','desc').limit(30).get()
      .then(function(snap){
        if(snap.empty){ list.innerHTML = '<div class="empty">কোনো পোস্ট নেই</div>'; return; }
        list.innerHTML = '';
        snap.forEach(function(doc){
          var d = doc.data();
          var div = document.createElement('div');
          div.className = 'post';
          var h = '';
          if(d.createdAt && d.createdAt.toDate){
            h += '<div class="d">'+d.createdAt.toDate().toLocaleString('bn-BD')+'</div>';
          }
          if(d.title) h += '<div style="font-weight:700;margin-bottom:3px">'+esc(d.title)+'</div>';
          if(d.text) h += '<div class="t">'+esc(d.text)+'</div>';
          var img = '';
          if(d.media && d.media.length){
            d.media.forEach(function(m){
              if(m.type==='image' && m.url) img = m.url;
              else if(m.type!=='image') h += '<div class="hint">'+esc(m.type)+': '+esc((m.name||'').slice(0,40))+'</div>';
            });
          }
          if(!img && d.imageLink) img = d.imageLink;
          if(img) h += '<img src="'+String(img).replace(/"/g,'&quot;')+'" onerror="this.style.display=\'none\'">';
          h += '<button class="btn btn-red btn-sm" onclick="delPost(\''+doc.id+'\')">ডিলিট</button>';
          div.innerHTML = h;
          list.appendChild(div);
        });
      })
      .catch(function(){
        list.innerHTML = '<div class="empty" style="color:#b84a42">লোড ব্যর্থ</div>';
      });
  }

  window.delPost = function(id){
    if(!confirm('ডিলিট করবেন?')) return;
    db.collection('posts').doc(id).delete().then(loadList);
  };

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
